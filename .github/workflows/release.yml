name: Release

# 推送 v* 标签时触发：创建 GitHub Release 并自动生成 release notes。
# 只针对根模块（go.mod）；不编译，避免 go.work / example 模块（其本地 replace 在 CI 不存在）参与构建。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
